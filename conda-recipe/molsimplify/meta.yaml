{% set version = "1.8.0" %}

package:
  name: autosolvate-molsimplify
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/m/molsimplify/molsimplify-{{ version }}.tar.gz
  sha256: b3b1fe16ae5fb760a1f656c49b9d48020f3e8fa1d2aed353fec7f6159f96868b

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - pip
    - python >=3.10,<3.13
    - setuptools
  run:
    - importlib-resources
    - networkx >=2.7
    - numpy <2
    - openbabel
    - pandas
    - python >=3.10,<3.13
    - pyyaml
    - scikit-learn
    - scipy <1.12

test:
  imports:
    - molSimplify
    - molSimplify.Classes.mol3D
  commands:
    - python -c "from importlib.metadata import version; assert version('molSimplify') == '1.8.0'"

about:
  home: https://github.com/hjkgrp/molSimplify
  license: GPL-3.0-only
  license_file: LICENSE
  summary: Unofficial molSimplify 1.8.0 compatibility package for AutoSolvate 
  description: |
    This is an unofficial redistribution of molSimplify 1.8.0 packaged
    for compatibility with AutoSolvate. molSimplify is developed and
    copyrighted by its original authors. The AutoSolvate developers are
    not affiliated with or endorsed by the molSimplify developers.

    The original source code is available from:
    https://github.com/hjkgrp/molSimplify/tree/v1.8.0

    This package is distributed under the GNU General Public License v3.
  dev_url: https://github.com/hjkgrp/molSimplify

extra:
  recipe-maintainers:
    - Liu-group
